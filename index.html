<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ôn tập Lịch sử Đảng Cộng sản Việt Nam</title>
  
  <!-- Favicon biểu tượng cờ đỏ búa liềm / sao vàng -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%238f2233%22/><text y=%22.9em%22 font-size=%2260%22 x=%2220%22 fill=%22%23ffd700%22>★</text></svg>">
  
  <meta name="theme-color" content="#8f2233">
  
  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet (Đã tích hợp trực tiếp vào HTML) -->
  <style>
/* ==========================================================================
   STYLESHEET: ÔN TẬP LỊCH SỬ ĐẢNG CỘNG SẢN VIỆT NAM
   Design System: Parchment / Crimson Heritage Aesthetic
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

:root {
  --font-main: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-serif: "Playfair Display", Georgia, "Times New Roman", serif;
  
  /* Theme Colors (Light Parchment) */
  --paper: #f6f3eb;
  --paper-raised: #fbf9f4;
  --paper-card: #ffffff;
  --paper-line: #e2dbcd;
  --paper-line-soft: #ede7dc;
  
  --ink: #221d19;
  --ink-soft: #635b52;
  --ink-muted: #8c8275;
  
  --crimson: #8f2233;
  --crimson-hover: #751a28;
  --crimson-ink: #6e1a27;
  --crimson-bg: #faeaed;
  
  --gold: #9c7a2e;
  --gold-soft: #b8923a;
  --gold-bg: #f9f4e6;
  
  --success: #2b7a4b;
  --success-bg: #e7f4ec;
  --success-line: #a8d5b8;
  
  --danger: #b3392a;
  --danger-bg: #fae9e7;
  --danger-line: #f1b3ab;
  
  --shadow-sm: 0 1px 3px rgba(34, 29, 25, 0.05), 0 4px 12px rgba(34, 29, 25, 0.04);
  --shadow-md: 0 4px 14px rgba(34, 29, 25, 0.08), 0 12px 28px -6px rgba(34, 29, 25, 0.08);
  --shadow-lg: 0 10px 30px rgba(34, 29, 25, 0.12);
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-full: 9999px;
  
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  --paper: #161311;
  --paper-raised: #201b17;
  --paper-card: #27221e;
  --paper-line: #3d352e;
  --paper-line-soft: #302a24;
  
  --ink: #ede7df;
  --ink-soft: #b5aba0;
  --ink-muted: #857a6f;
  
  --crimson: #df6475;
  --crimson-hover: #e67d8c;
  --crimson-ink: #f29da9;
  --crimson-bg: #351a1e;
  
  --gold: #d8b257;
  --gold-soft: #e5c36f;
  --gold-bg: #302613;
  
  --success: #60c585;
  --success-bg: #153320;
  --success-line: #2d6b44;
  
  --danger: #ef7769;
  --danger-bg: #381b17;
  --danger-line: #7a3128;
  
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.6);
}

/* ================= Base Styles ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-main);
  background-color: var(--paper);
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-bottom: 60px;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

/* Container */
.screen {
  width: 100%;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  animation: fadeIn 0.25s ease-out;
}

.wrap {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Top Navigation Bar */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  width: 100%;
}

.nav-group {
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-soft);
  background: var(--paper-raised);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-full);
  transition: var(--transition);
}

.nav-btn:hover {
  background: var(--paper-card);
  color: var(--ink);
  border-color: var(--gold-soft);
  transform: translateY(-1px);
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-soft);
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.back-link:hover {
  color: var(--crimson);
  background: rgba(143, 34, 51, 0.06);
}

/* ================= Masthead / Header ================= */
.masthead {
  text-align: center;
  margin-bottom: 36px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.eyebrow {
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 10px;
}

.seal {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--crimson);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  box-shadow: 0 0 0 3px rgba(156, 122, 46, 0.4), var(--shadow-sm);
  flex-shrink: 0;
}

.main-title {
  font-size: 27px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}

.sub-title {
  font-size: 15px;
  color: var(--ink-soft);
  max-width: 600px;
  margin-top: 6px;
}

/* ================= Subject Picker (Image 1) ================= */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  margin-top: 10px;
  margin-bottom: 36px;
}

.subject-card {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 26px 24px;
  text-align: left;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.subject-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
  border-color: var(--gold);
}

.card-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}

.card-desc {
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 18px;
  line-height: 1.5;
}

.card-badge {
  display: inline-flex;
  align-items: center;
  font-size: 12.5px;
  font-weight: 600;
  padding: 4px 12px;
  background: var(--paper-raised);
  color: var(--gold);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-full);
  align-self: flex-start;
}

.bottom-teacher-link {
  text-align: center;
  margin-top: 20px;
}

.teacher-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--gold);
  padding: 8px 18px;
  border-radius: var(--radius-full);
  background: var(--gold-bg);
  border: 1px solid rgba(156, 122, 46, 0.25);
  transition: var(--transition);
}

.teacher-btn:hover {
  background: var(--gold);
  color: #fff;
  box-shadow: var(--shadow-sm);
}

/* ================= Menu List (Image 2) ================= */
.section-label {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin: 28px 0 12px 6px;
}

.part-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.part-row {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  text-align: left;
}

.part-row:hover {
  transform: translateX(3px);
  border-color: var(--gold);
  box-shadow: var(--shadow-md);
}

.part-num {
  font-size: 17px;
  font-weight: 700;
  color: var(--gold);
  font-family: serif;
  width: 28px;
  text-align: center;
  flex-shrink: 0;
}

.part-body {
  flex: 1;
}

.part-body h3 {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
}

.part-body p {
  font-size: 13.5px;
  color: var(--ink-soft);
  line-height: 1.45;
}

.part-arrow {
  font-size: 20px;
  color: var(--ink-muted);
  transition: var(--transition);
}

.part-row:hover .part-arrow {
  color: var(--crimson);
  transform: translateX(3px);
}

/* ================= Gate & Identity Cards (Image 3) ================= */
.gate-card {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 32px 30px;
  box-shadow: var(--shadow-md);
  margin: 10px auto;
  max-width: 540px;
  width: 100%;
}

.gate-card h2 {
  font-size: 21px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}

.gate-card p {
  font-size: 14.5px;
  color: var(--ink-soft);
  margin-bottom: 22px;
  line-height: 1.5;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

.text-input {
  width: 100%;
  padding: 13px 16px;
  font-size: 15px;
  background: var(--paper-raised);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-sm);
  color: var(--ink);
  outline: none;
  transition: var(--transition);
}

.text-input:focus {
  border-color: var(--crimson);
  background: var(--paper-card);
  box-shadow: 0 0 0 3px rgba(143, 34, 51, 0.12);
}

.btn-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 10px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 22px;
  font-size: 14.5px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.btn-primary {
  background: var(--crimson);
  color: #fff;
}

.btn-primary:hover {
  background: var(--crimson-hover);
  box-shadow: 0 4px 12px rgba(143, 34, 51, 0.25);
  transform: translateY(-1px);
}

.btn-ghost {
  background: var(--paper-raised);
  color: var(--ink-soft);
  border: 1px solid var(--paper-line);
}

.btn-ghost:hover {
  background: var(--paper-line-soft);
  color: var(--ink);
}

.gate-error {
  color: var(--danger);
  font-size: 13.5px;
  margin-top: 10px;
  font-weight: 500;
  min-height: 18px;
}

.gate-hint {
  font-size: 12.5px;
  color: var(--ink-muted);
  margin-top: 16px;
  line-height: 1.45;
  border-top: 1px dashed var(--paper-line);
  padding-top: 12px;
}

/* ================= Quiz Screen (Image 4) ================= */
.quiz-header-card {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}

.quiz-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.quiz-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
}

.quiz-badge {
  font-size: 14px;
  font-weight: 600;
  color: var(--gold);
}

.timer-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 14px;
  font-weight: 700;
  color: var(--crimson);
  background: var(--crimson-bg);
  padding: 3px 10px;
  border-radius: var(--radius-full);
}

.progress-track {
  width: 100%;
  height: 6px;
  background: var(--paper-line-soft);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--crimson));
  border-radius: var(--radius-full);
  transition: width 0.3s ease;
}

/* Question Card */
.question-card {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

/* Subtle Watermark (Image 4) */
.watermark-layer {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  user-select: none;
  overflow: hidden;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  opacity: 0.08;
  transform: rotate(-15deg) scale(1.3);
}

.watermark-line {
  white-space: nowrap;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 3px;
}

.q-content {
  position: relative;
  z-index: 2;
}

.q-tag-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.q-tag {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
}

.q-counter {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-soft);
}

.q-text {
  font-size: 18.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.55;
  margin-bottom: 22px;
}

/* Options (Image 4) */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.opt-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 13px 18px;
  background: var(--paper-raised);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  text-align: left;
  transition: var(--transition);
}

.opt-btn:hover:not(:disabled) {
  background: var(--paper-line-soft);
  border-color: var(--gold-soft);
  transform: translateX(2px);
}

.opt-letter {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--paper-line-soft);
  color: var(--ink-soft);
  font-size: 13.5px;
  font-weight: 700;
  flex-shrink: 0;
  transition: var(--transition);
}

.opt-text {
  font-size: 15.5px;
  color: var(--ink);
  line-height: 1.45;
  flex: 1;
}

/* Selected state (Exam mode) */
.opt-btn.selected {
  background: var(--paper-card);
  border-color: var(--crimson);
  box-shadow: 0 0 0 2px var(--crimson);
}

.opt-btn.selected .opt-letter {
  background: var(--crimson);
  color: #fff;
}

/* Correct / Wrong states (Practice mode) */
.opt-btn.correct {
  background: var(--success-bg) !important;
  border-color: var(--success) !important;
  color: var(--success) !important;
}

.opt-btn.correct .opt-letter {
  background: var(--success);
  color: #fff;
}

.opt-btn.wrong {
  background: var(--danger-bg) !important;
  border-color: var(--danger) !important;
}

.opt-btn.wrong .opt-letter {
  background: var(--danger);
  color: #fff;
}

/* Explanation Box */
.explain-box {
  background: var(--gold-bg);
  border: 1px solid rgba(156, 122, 46, 0.3);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  margin-top: 18px;
  margin-bottom: 24px;
  animation: fadeIn 0.2s ease;
}

.explain-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 6px;
}

.explain-desc {
  font-size: 14px;
  color: var(--ink-soft);
  line-height: 1.5;
}

/* Actions footer */
.q-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

/* Question Palette (for Exam jumping) */
.palette-btn-open {
  font-size: 13.5px;
  color: var(--ink-soft);
  text-decoration: underline;
  cursor: pointer;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
  gap: 8px;
  padding: 16px 0;
  max-height: 260px;
  overflow-y: auto;
}

.palette-item {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-sm);
  background: var(--paper-raised);
  border: 1px solid var(--paper-line);
  color: var(--ink-soft);
  transition: var(--transition);
}

.palette-item.current {
  border-color: var(--crimson);
  color: var(--crimson);
  font-weight: 700;
}

.palette-item.answered {
  background: var(--crimson);
  border-color: var(--crimson);
  color: #fff;
}

/* ================= Score / Results Screen ================= */
.score-card {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-lg);
  padding: 36px 24px;
  text-align: center;
  box-shadow: var(--shadow-md);
  margin-bottom: 24px;
}

.score-num {
  font-size: 52px;
  font-weight: 800;
  color: var(--crimson);
  line-height: 1.1;
  font-family: serif;
}

.score-total {
  font-size: 16.5px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-top: 6px;
  margin-bottom: 12px;
}

.student-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  background: var(--paper-raised);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-full);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 24px;
}

.stat-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 12px;
  padding-top: 20px;
  border-top: 1px solid var(--paper-line-soft);
}

.stat-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-val {
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}

.stat-label {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 2px;
}

.review-item {
  background: var(--paper-card);
  border: 1px solid var(--paper-line);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}

.review-opt {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  margin: 6px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ================= Flashcard Screen ================= */
.flash-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 10px;
}

.flashcard {
  width: 100%;
  max-width: 580px;
  min-height: 280px;
  perspective: 1000px;
  cursor: pointer;
  margin-bottom: 20px;
}

.flashcard-inner {
  position: relative;
  width: 100%;

  <!-- Logic ứng dụng (Đã tích hợp trực tiếp vào HTML) -->
  <script>
/**
 * ỨNG DỤNG ÔN TẬP VÀ THI THỬ TRẮC NGHIỆM LỊCH SỬ ĐẢNG CỘNG SẢN VIỆT NAM
 * 
 * Các chức năng chính:
 * - Khóa truy cập môn học (Password Gate)
 * - Màn hình chọn ôn tập: Ôn toàn bộ 150 câu, Ôn câu hay sai, Thẻ ghi nhớ Flashcard, Thi thử giữa kỳ 50 câu ngẫu nhiên
 * - Form nhập Họ tên & MSSV trước khi làm bài, watermark mờ chống gian lận
 * - Giao diện làm bài 4 đáp án từng dòng, thanh tiến độ, bộ đếm điểm, giải thích chi tiết
 * - Màn hình kết quả & chấm điểm thang 10
 * - Bảng điều khiển Giảng viên: thống kê, quản lý kết quả sinh viên, xuất Excel (.xlsx), đổi mật khẩu
 * - Chế độ sáng/tối và âm thanh phản hồi
 */

(function () {
  "use strict";

  /* ---------------- CẤU HÌNH & KHÓA LƯU TRỮ ---------------- */
  const KEYS = {
    SUBJECT_PW: "lsd_subject_pw_v2",
    TEACHER_PW: "lsd_teacher_pw_v2",
    STUDENT_SESSION: "lsd_student_session_v2",
    TEACHER_SESSION: "lsd_teacher_session_v2",
    LAST_STUDENT: "lsd_last_student_v2",
    WRONG_BANK: "lsd_wrong_bank_v2",
    SUBMISSIONS: "lsd_submissions_log_v2",
    FLASH_MASTERY: "lsd_flash_mastery_v2",
    THEME: "lsd_theme_v2",
    SOUND: "lsd_sound_v2",
    LAST_ACTIVITY: "lsd_last_activity_v2",
    INACTIVITY_LOCKED: "lsd_inactivity_locked_v2"
  };

  // Luôn xóa phiên đăng nhập khi tải lại trang / refresh để bắt buộc nhập lại mật khẩu
  try {
    sessionStorage.removeItem(KEYS.STUDENT_SESSION);
    sessionStorage.removeItem(KEYS.TEACHER_SESSION);
  } catch (e) {}

  // Mật khẩu mặc định ban đầu & Giới hạn không hoạt động (60 phút)
  const DEFAULT_SUBJECT_PW = "lsd2026";
  const DEFAULT_TEACHER_PW = "giangvien2026";
  const INACTIVITY_TIMEOUT_MS = 60 * 60 * 1000; // 60 phút

  function getSubjectPassword() {
    return localStorage.getItem(KEYS.SUBJECT_PW) || DEFAULT_SUBJECT_PW;
  }

  function setSubjectPassword(pw) {
    localStorage.setItem(KEYS.SUBJECT_PW, pw.trim());
  }

  function getTeacherPassword() {
    return localStorage.getItem(KEYS.TEACHER_PW) || DEFAULT_TEACHER_PW;
  }

  function setTeacherPassword(pw) {
    localStorage.setItem(KEYS.TEACHER_PW, pw.trim());
  }

  /* ---------------- QUẢN LÝ DỮ LIỆU ĐỊA PHƯƠNG ---------------- */
  function loadLastStudent() {
    try {
      return JSON.parse(localStorage.getItem(KEYS.LAST_STUDENT) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveLastStudent(stu) {
    localStorage.setItem(KEYS.LAST_STUDENT, JSON.stringify(stu));
  }

  function loadWrongBank() {
    try {
      return JSON.parse(localStorage.getItem(KEYS.WRONG_BANK) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveWrongBank(bank) {
    localStorage.setItem(KEYS.WRONG_BANK, JSON.stringify(bank));
  }

  function addWrongQuestion(qId) {
    const bank = loadWrongBank();
    bank[qId] = (bank[qId] || 0) + 1;
    saveWrongBank(bank);
  }

  function removeWrongQuestion(qId) {
    const bank = loadWrongBank();
    if (bank[qId]) {
      delete bank[qId];
      saveWrongBank(bank);
    }
  }

  function loadSubmissions() {
    try {
      return JSON.parse(localStorage.getItem(KEYS.SUBMISSIONS) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveSubmission(record) {
    const list = loadSubmissions();
    list.unshift(record); // mới nhất lên đầu
    localStorage.setItem(KEYS.SUBMISSIONS, JSON.stringify(list));
  }

  function clearSubmissions() {
    localStorage.setItem(KEYS.SUBMISSIONS, JSON.stringify([]));
  }

  function loadFlashMastery() {
    try {
      return JSON.parse(localStorage.getItem(KEYS.FLASH_MASTERY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveFlashMastery(data) {
    localStorage.setItem(KEYS.FLASH_MASTERY, JSON.stringify(data));
  }

  /* ---------------- HIỆU ỨNG ÂM THANH (WEB AUDIO API) ---------------- */
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playSound(type) {
    if (state.sound === false) return;
    try {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === "correct") {
        // Âm thanh tươi vui khi chọn đúng
        osc.type = "sine";
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === "wrong") {
        // Âm trầm nhẹ khi chọn sai
        osc.type = "triangle";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    } catch (e) {
      // Bỏ qua nếu trình duyệt không hỗ trợ Web Audio
    }
  }

  /* ---------------- QUẢN LÝ KHÓA PHIÊN 60 PHÚT KHÔNG SỬ DỤNG ---------------- */
  let lastActivityTime = parseInt(localStorage.getItem(KEYS.LAST_ACTIVITY) || String(Date.now()), 10);
  let isSessionLocked = localStorage.getItem(KEYS.INACTIVITY_LOCKED) === "true";

  function recordUserActivity() {
    if (isSessionLocked) return;
    const now = Date.now();
    if (now - lastActivityTime >= INACTIVITY_TIMEOUT_MS) {
      triggerInactivityLock();
      return;
    }
    lastActivityTime = now;
    localStorage.setItem(KEYS.LAST_ACTIVITY, String(now));
  }

  function triggerInactivityLock() {
    isSessionLocked = true;
    localStorage.setItem(KEYS.INACTIVITY_LOCKED, "true");
    // Hủy phiên đăng nhập của sinh viên và giảng viên
    sessionStorage.removeItem(KEYS.STUDENT_SESSION);
    sessionStorage.removeItem(KEYS.TEACHER_SESSION);
    if (state.quizSession && state.quizSession.timerInterval) {
      clearInterval(state.quizSession.timerInterval);
    }
    showInactivityLockOverlay();
  }

  function showInactivityLockOverlay() {
    if (typeof document === "undefined" || !document.body) return;
    if (document.getElementById("inactivity-lock-overlay")) return;
    const overlay = el("div", { class: "inactivity-overlay", id: "inactivity-lock-overlay" }, [
      el("div", { class: "inactivity-card" }, [
        el("div", { class: "inactivity-icon" }, ["⏰ 🔒"]),
        el("h2", {}, ["Phiên làm việc đã hết hạn"]),
        el("p", {}, [
          "Hệ thống ghi nhận bạn đã không thao tác trên trang web quá 60 phút.",
          el("br", {}),
          el("br", {}),
          "Để bảo đảm tính an toàn dữ liệu và trung thực trong học tập, hệ thống đã khóa phiên làm việc. Vui lòng bấm nút bên dưới để tải lại trang và nhập lại mật khẩu môn học để tiếp tục sử dụng."
        ]),
        el("div", { style: "display:flex;gap:12px;justify-content:center;" }, [
          el("button", {
            class: "btn btn-primary",
            style: "padding:12px 26px;font-size:15px;font-weight:600;",
            onclick: () => {
              localStorage.removeItem(KEYS.INACTIVITY_LOCKED);
              localStorage.setItem(KEYS.LAST_ACTIVITY, String(Date.now()));
              sessionStorage.removeItem(KEYS.STUDENT_SESSION);
              sessionStorage.removeItem(KEYS.TEACHER_SESSION);
              window.location.reload();
            }
          }, ["🔄 Tải lại trang (F5) & Nhập mật khẩu"])
        ])
      ])
    ]);
    document.body.appendChild(overlay);
  }

  // Đăng ký sự kiện lắng nghe hoạt động người dùng
  if (typeof window !== "undefined") {
    const activityEvents = ["mousemove", "mousedown", "keydown", "scroll", "touchstart", "click"];
    activityEvents.forEach(evt => {
      window.addEventListener(evt, recordUserActivity, { passive: true });
    });

    setInterval(() => {
      if (isSessionLocked) return;
      if (Date.now() - lastActivityTime >= INACTIVITY_TIMEOUT_MS) {
        triggerInactivityLock();
      }
    }, 5000);

    window.addEventListener("focus", () => {
      if (isSessionLocked) return;
      if (Date.now() - lastActivityTime >= INACTIVITY_TIMEOUT_MS) {
        triggerInactivityLock();
      }
    });

    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          if (isSessionLocked) return;
          if (Date.now() - lastActivityTime >= INACTIVITY_TIMEOUT_MS) {
            triggerInactivityLock();
          }
        }
      });
    }
  }

  /* ---------------- STATE TOÀN CỤC ---------------- */
  const state = {
    view: "subjectPicker", // subjectPicker | gate | home | chapterPicker | chapterDetail | identity | quiz | results | flashcard | teacherGate | teacherDashboard
    theme: localStorage.getItem(KEYS.THEME) || "light",
    sound: localStorage.getItem(KEYS.SOUND) !== "false",
    student: loadLastStudent(),
    
    // Quản lý chương đang xem chi tiết (ch1 | ch2 | ch3)
    selectedChapterId: "ch1",
    
    // Quiz state
    quizSession: null,
    
    // Flashcard state
    flashIndex: 0,
    flashFlipped: false,
    flashChapterFilter: "all", // all | ch1 | ch2 | ch3

    // Teacher state
    teacherTab: "stats", // stats | wrong | password
    teacherSearch: "",
    teacherFilterMode: "all",

    // Callback cho identity form
    identityContext: null
  };

  function applyTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem(KEYS.THEME, theme);
  }
  applyTheme(state.theme);

  function toggleTheme() {
    applyTheme(state.theme === "dark" ? "light" : "dark");
    render();
  }

  function toggleSound() {
    state.sound = !state.sound;
    localStorage.setItem(KEYS.SOUND, state.sound ? "true" : "false");
    render();
  }

  /* ---------------- TIỆN ÍCH TẠO PHẦN TỬ DOM (el) ---------------- */
  function el(tag, attrs = {}, children = []) {
    const element = document.createElement(tag);
    for (const [key, val] of Object.entries(attrs)) {
      if (key.startsWith("on") && typeof val === "function") {
        element.addEventListener(key.substring(2).toLowerCase(), val);
      } else if (key === "style" && typeof val === "string") {
        element.style.cssText = val;
      } else if (val !== null && val !== undefined) {
        element.setAttribute(key, val);
      }
    }
    if (!Array.isArray(children)) children = [children];
    for (const child of children) {
      if (child === null || child === undefined) continue;
      if (typeof child === "string" || typeof child === "number") {
        element.appendChild(document.createTextNode(String(child)));
      } else if ((typeof Node !== 'undefined' && child instanceof Node) || (child && typeof child === 'object')) {
        element.appendChild(child);
      }
    }
    return element;
  }

  /* ---------------- THANH ĐIỀU HƯỚNG TRÊN CÙNG ---------------- */
  function topNav(backAction, backLabel = "← Quay lại") {
    const nav = el("div", { class: "top-nav" });
    if (backAction) {
      nav.appendChild(
        el("button", { class: "back-link", onclick: backAction }, [backLabel])
      );
    } else {
      nav.appendChild(el("span", {}));
    }

    const group = el("div", { class: "nav-group" });

    // Nút Về môn học / Trang chủ
    if (state.view !== "subjectPicker") {
      group.appendChild(
        el("button", {
          class: "nav-btn",
          onclick: () => {
            if (state.quizSession && !state.quizSession.isSubmitted) {
              if (!confirm("Bạn có chắc muốn thoát bài làm dở không? Tiến độ hiện tại sẽ không được lưu.")) return;
              if (state.quizSession.timerInterval) clearInterval(state.quizSession.timerInterval);
            }
            try {
              sessionStorage.removeItem(KEYS.STUDENT_SESSION);
              sessionStorage.removeItem(KEYS.TEACHER_SESSION);
            } catch (e) {}
            state.view = "subjectPicker";
            render();
          }
        }, ["⇄ Trang chủ"])
      );
    }

    // Nút Bật/Tắt âm thanh
    group.appendChild(
      el("button", {
        class: "nav-btn",
        onclick: toggleSound,
        title: state.sound ? "Tắt âm thanh" : "Bật âm thanh"
      }, [state.sound ? "🔊 Bật tiếng" : "🔇 Tắt tiếng"])
    );

    // Nút Chế độ sáng / tối
    group.appendChild(
      el("button", {
        class: "nav-btn",
        onclick: toggleTheme,
        title: "Đổi giao diện sáng/tối"
      }, [state.theme === "dark" ? "☀️ Sáng" : "🌙 Tối"])
    );

    nav.appendChild(group);
    return nav;
  }

  /* ---------------- TIÊU ĐỀ MASTHEAD ---------------- */
  function masthead(sealText = "LSĐ", title = "Học phần Lịch sử Đảng Cộng sản Việt Nam", sub = "Hệ thống hỗ trợ ôn tập và thi thử trắc nghiệm trực tuyến dành cho sinh viên.") {
    return el("div", { class: "masthead" }, [
      el("div", { class: "eyebrow" }, ["CHỌN HỌC PHẦN CẦN ÔN TẬP"]),
      el("div", { class: "brand-row" }, [
        el("div", { class: "seal" }, [sealText]),
        el("h1", { class: "main-title" }, [title])
      ]),
      el("p", { class: "sub-title" }, [sub])
    ]);
  }

  /* ---------------- MÀN HÌNH 1: CHỌN HỌC PHẦN (ẢNH 1) ---------------- */
  function renderSubjectPicker() {
    // Luôn xóa phiên sinh viên khi ở màn hình Chọn học phần (hoặc khi refresh trang)
    try {
      sessionStorage.removeItem(KEYS.STUDENT_SESSION);
    } catch (e) {}

    const wrap = el("div", { class: "screen" });
    const inner = el("div", { class: "wrap" });

    inner.appendChild(topNav(null));
    inner.appendChild(masthead("LSĐ", "Học phần Lịch sử Đảng Cộng sản Việt Nam", "Mỗi học phần có mật khẩu truy cập riêng do giảng viên cung cấp."));

    const grid = el("div", { class: "cards-grid" });

    // Thẻ môn học Lịch sử Đảng: Luôn bắt nhập mật khẩu môn học khi bấm vào
    const lsdCard = el("button", {
      class: "subject-card",
      onclick: () => {
        state.view = "gate";
        render();
      }
    }, [
      el("div", {}, [
        el("div", { class: "card-title" }, ["Lịch sử Đảng Cộng sản Việt Nam"]),
        el("p", { class: "card-desc" }, [
          `Ôn tập ${(window.QUESTION_BANK_LSD || []).length} câu chia theo từng chương & mục nhỏ · Thi thử trắc nghiệm 50 câu · Có đáp án & giải thích chi tiết.`
        ])
      ]),
      el("div", { class: "card-badge" }, [`${(window.QUESTION_BANK_LSD || []).length} câu hỏi · 3 Chương`])
    ]);

    grid.appendChild(lsdCard);
    inner.appendChild(grid);

    // Nút Giảng viên ở cuối màn hình: Luôn bắt nhập mật khẩu giảng viên khi bấm vào
    inner.appendChild(
      el("div", { class: "bottom-teacher-link" }, [
        el("button", {
          class: "teacher-btn",
          onclick: () => {
            state.view = "teacherGate";
            render();
          }
        }, ["🔒 Giảng viên"])
      ])
    );

    wrap.appendChild(inner);
    return wrap;
  }

  /* ---------------- MÀN HÌNH KHÓA: NHẬP MẬT KHẨU MÔN HỌC (GATE) ---------------- */
  function renderGate() {
    const wrap = el("div", { class: "screen" });
    const inner = el("div", { class: "wrap" });

    inner.appendChild(topNav(() => {
      state.view = "subjectPicker";
      render();
    }));

    inner.appendChild(masthead("LSĐ", "Lịch sử Đảng Cộng sản Việt Nam", "Vui lòng nhập mật khẩu truy cập để vào hệ thống."));

    const input = el("input", {
      type: "password",
      class: "text-input",
      placeholder: "Nhập mật khẩu truy cập môn học...",
      id: "gate-pw-input"
    });

    const errorBox = el("div", { class: "gate-error" });

    function tryUnlock() {
      const val = input.value.trim();
      const currentPw = getSubjectPassword();
      if (!val) {
        errorBox.textContent = "Vui lòng nhập mật khẩu.";
        return;
      }
      if (val === currentPw) {
        sessionStorage.setItem(KEYS.STUDENT_SESSION, "true");
        state.view = "home";
        render();
      } else {
        errorBox.textContent = "Mật khẩu không chính xác, vui lòng thử lại!";
        input.focus();
        input.select();
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryUnlock();
    });

    const card = el("div", { class: "gate-card" }, [
      el("h2", {}, ["Khu vực dành cho sinh viên"]),
      el("p", {}, ["Nhập mật khẩu được giảng viên cung cấp để vào ôn tập môn Lịch sử Đảng Cộng sản Việt Nam."]),
      el("div", { class: "form-group" }, [input]),
      errorBox,
      el("div", { class: "btn-row" }, [
        el("button", {
          class: "btn btn-ghost",
          onclick: () => {
            state.view = "subjectPicker";
            render();
          }
        }, ["‹ Quay lại"]),
        el("button", {
          class: "btn btn-primary",
          onclick: tryUnlock
        }, ["Vào ôn tập"])
      ]),
      el("div", { class: "gate-hint" }, [
        "💡 Mật khẩu mặc định do giảng viên cấp: ",
        el("strong", { style: "color:var(--crimson);" }, ["lsd2026"]),
        " (có thể đổi trong Bảng điều khiển Giảng viên)."
      ])
    ]);

    inner.appendChild(card);
    wrap.appendChild(inner);

    setTimeout(() => {
      input.focus();
    }, 50);

    return wrap;
  }

  /* ---------------- MÀN HÌNH 2: MENU CHÍNH HỌC PHẦN ---------------- */
  function renderHome() {
    const wrap = el("div", { class: "screen" });
    const inner = el("div", { class: "wrap" });

    inner.appendChild(topNav(() => {
      state.view = "subjectPicker";
      render();
    }));

    inner.appendChild(el("div", { class: "masthead", style: "margin-bottom:24px;" }, [
      el("div", { class: "eyebrow" }, ["HỌC PHẦN LỊCH SỬ ĐẢNG CỘNG SẢN VIỆT NAM"]),
      el("div", { class: "brand-row" }, [
        el("div", { class: "seal" }, ["LSĐ"]),
        el("h1", { class: "main-title" }, ["Trợ lý ôn tập Lịch sử Đảng"])
      ]),
      el("p", { class: "sub-title" }, ["Lựa chọn hình thức ôn tập hoặc tham gia thi thử trắc nghiệm có chấm điểm."])
    ]));

    // PHẦN 1 — ÔN TẬP
    inner.appendChild(el("p", { class: "section-label" }, ["Phần 1 — Ôn tập"]));
    const part1 = el("div", { class: "part-list" });

    // I. Ôn tập theo chương (Mở giao diện Ảnh 1 & 2)
    part1.appendChild(
      el("button", {
        class: "part-row",
        onclick: () => {
          state.view = "chapterPicker";
          render();
        }
      }, [
        el("span", { class: "part-num" }, ["I"]),
        el("div", { class: "part-body" }, [
          el("h3", {}, ["Ôn tập theo chương"]),
          el("p", {}, ["Phân chia thành 3 chương với 7 mục nội dung nhỏ, hỗ trợ chọn từng mục để học dễ nhớ hoặc ôn tập toàn bộ chương."])
        ]),
        el("span", { class: "part-arrow" }, ["›"])
      ])
    );

    // II. Ôn câu hay sai
    const wrongCount = Object.keys(loadWrongBank()).length;
    part1.appendChild(
      el("button", {
        class: "part-row",
        onclick: () => {
          if (wrongCount === 0) {

  /* ---------------- ĐIỀU HƯỚNG NHẬP THÔNG TIN SINH VIÊN ---------------- */
  function goIdentity(label, onConfirm) {
    state.identityContext = {
      label: label,
      onConfirm: onConfirm,
      onBack: () => {
        state.view = "home";
        render();
      }
    };
    state.view = "identity";
    render();
  }

  /* ---------------- MÀN HÌNH 3: NHẬP HỌ TÊN VÀ MSSV (ẢNH 3) ---------------- */
  function renderIdentity() {
    const ctx = state.identityContext || {};
    const last = loadLastStudent();

    const wrap = el("div", { class: "screen" });
    const inner = el("div", { class: "wrap" });

    inner.appendChild(topNav(() => {
      if (ctx.onBack) ctx.onBack();
      else { state.view = "home"; render(); }
    }));

    inner.appendChild(masthead("LSĐ", "Học phần Lịch sử Đảng Cộng sản Việt Nam", "Trợ lý ôn tập Lịch sử Đảng"));

    const nameInput = el("input", {
      type: "text",
      class: "text-input",
      placeholder: "Họ và tên sinh viên...",
      value: last.name || "",
      id: "stu-name-input"
    });

    const mssvInput = el("input", {
      type: "text",
      class: "text-input",
      placeholder: "Mã số sinh viên (MSSV)...",
      value: last.mssv || "",
      id: "stu-mssv-input"
    });

    const errBox = el("div", { class: "gate-error" });

    function tryConfirm() {
      const name = nameInput.value.trim();
      const mssv = mssvInput.value.trim();
      if (!name || !mssv) {
        errBox.textContent = "Vui lòng nhập đầy đủ Họ tên và Mã số sinh viên.";
        if (!name) nameInput.focus();
        else mssvInput.focus();
        return;
      }
      const student = { name, mssv };
      saveLastStudent(student);
      state.student = student;
      if (ctx.onConfirm) ctx.onConfirm(student);
    }

    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") mssvInput.focus();
    });
    mssvInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryConfirm();
    });

    const card = el("div", { class: "gate-card" }, [
      el("h2", {}, ["Thông tin trước khi làm bài"]),
      el("p", {}, [
        `Bạn sắp bắt đầu: ${ctx.label || "Bài ôn tập"}. Vui lòng nhập Họ tên và Mã số sinh viên để giảng viên ghi nhận kết quả làm bài.`
      ]),
      el("div", { class: "form-group" }, [
        nameInput,
        mssvInput
      ]),
      errBox,
      el("div", { class: "btn-row" }, [
        el("button", {
          class: "btn btn-ghost",
          onclick: () => {
            if (ctx.onBack) ctx.onBack();
            else { state.view = "home"; render(); }
          }
        }, ["‹ Quay lại"]),
        el("button", {
          class: "btn btn-primary",
          onclick: tryConfirm
        }, ["Bắt đầu làm bài"])
      ])
    ]);

    inner.appendChild(card);
    wrap.appendChild(inner);

    setTimeout(() => {
      if (last.name) mssvInput.focus();
      else nameInput.focus();
    }, 50);

    return wrap;
  }

  /* ---------------- KHỞI TẠO CÁC CHẾ ĐỘ THI / ÔN TẬP ---------------- */
  function startPractice(questions, student, title = "Luyện tập trắc nghiệm") {
    if (!questions || questions.length === 0) {
      alert("Chưa có câu hỏi trong ngân hàng!");
      return;
    }
    state.quizSession = {
      mode: "practice",
      title: title,
      student: student,
      questions: questions,
      currentIndex: 0,
      userAnswers: new Array(questions.length).fill(null),
      score: 0,
      isSubmitted: false,
      startTime: Date.now()
    };
    state.view = "quiz";
    render();
  }

  function startWrongReview(student) {
    const bank = loadWrongBank();
    const wrongIds = Object.keys(bank).map(Number);
    const all = window.QUESTION_BANK_LSD || [];
    const wrongQuestions = all.filter(q => wrongIds.includes(q.id));

    if (wrongQuestions.length === 0) {
      alert("Không có câu hỏi nào trong danh sách câu sai!");
      state.view = "home";
      render();
      return;
    }

    state.quizSession = {
      mode: "wrongReview",
      title: "Ôn câu hay sai",
      student: student,
      questions: wrongQuestions,
      currentIndex: 0,
      userAnswers: new Array(wrongQuestions.length).fill(null),
      score: 0,
      isSubmitted: false,
      startTime: Date.now()
    };
    state.view = "quiz";
    render();
  }

  function startExam(student) {
    const all = window.QUESTION_BANK_LSD || [];
    if (all.length === 0) {
      alert("Chưa có câu hỏi trong ngân hàng!");
      return;
    }

    // Bốc ngẫu nhiên 50 câu từ toàn bộ ngân hàng 300 câu
    const shuffled = [...all].sort(() => 0.5 - Math.random());
    const count = Math.min(50, shuffled.length);
    const selected = shuffled.slice(0, count);

    const examSeconds = 60 * 60; // 60 phút

    const session = {
      mode: "exam",
      title: "Thi thử giữa kỳ (50 câu)",
      student: student,
      questions: selected,
      currentIndex: 0,
      userAnswers: new Array(selected.length).fill(null),
      score: 0,
      timeLeft: examSeconds,
      isSubmitted: false,
      startTime: Date.now(),
      timerInterval: null
    };

    // Khởi động đồng hồ đếm ngược
    session.timerInterval = setInterval(() => {
      if (session.timeLeft > 0) {
        session.timeLeft--;
        const timerEl = document.getElementById("quiz-timer-display");
        if (timerEl) {
          timerEl.textContent = formatTime(session.timeLeft);
        }
      } else {
        clearInterval(session.timerInterval);
        alert("Đã hết thời gian làm bài 60 phút! Hệ thống sẽ tự động nộp bài.");
        finishQuiz();
      }
    }, 1000);

    state.quizSession = session;
    state.view = "quiz";
    render();
  }

  function formatTime(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m < 10 ? "0" : ""}${m}:${s < 10 ? "0" : ""}${s}`;
  }

  /* ---------------- MÀN HÌNH 4: GIAO DIỆN LÀM BÀI (ẢNH 4) ---------------- */
  function renderQuiz() {
    const s = state.quizSession;
    if (!s || !s.questions || s.questions.length === 0) {
      state.view = "home";
      return renderHome();
    }

    const wrap = el("div", { class: "screen" });
    const inner = el("div", { class: "wrap" });

    // Top Navigation
    inner.appendChild(topNav(() => {
      if (!s.isSubmitted) {
        if (!confirm("Bạn có chắc muốn thoát không? Tiến trình làm bài sẽ không được ghi nhận.")) return;
        if (s.timerInterval) clearInterval(s.timerInterval);
      }
      state.view = "home";
      render();
    }));

    const q = s.questions[s.currentIndex];
    const totalQ = s.questions.length;
    const currentAnswer = s.userAnswers[s.currentIndex];

    // Khung Tiến độ & Điểm số (Image 4 Header Card)
    const headerCard = el("div", { class: "quiz-header-card" });
    const metaRow = el("div", { class: "quiz-meta-row" }, [
      el("div", { class: "quiz-title" }, [s.title]),
      s.mode === "exam"
        ? el("div", { class: "timer-badge" }, [
            "⏱ ",
            el("span", { id: "quiz-timer-display" }, [formatTime(s.timeLeft)])
          ])
        : el("div", { class: "quiz-badge" }, [`Điểm: ${s.score}/${totalQ}`])
    ]);

    const progressTrack = el("div", { class: "progress-track" }, [
      el("div", {
        class: "progress-fill",
        style: `width: ${((s.currentIndex + 1) / totalQ) * 100}%`
      })
    ]);

    headerCard.appendChild(metaRow);
    headerCard.appendChild(progressTrack);
    inner.appendChild(headerCard);

    // Thẻ câu hỏi (Question Card)
    const qCard = el("div", { class: "question-card" });

    // Watermark mờ tên + MSSV (như trong Ảnh 4)
    const wmText = `${s.student.name || "Sinh viên"} · MSSV ${s.student.mssv || ""}`;
    const wmLayer = el("div", { class: "watermark-layer" }, [
      el("div", { class: "watermark-line" }, [wmText + "   " + wmText + "   " + wmText]),
      el("div", { class: "watermark-line" }, [wmText + "   " + wmText + "   " + wmText]),
      el("div", { class: "watermark-line" }, [wmText + "   " + wmText + "   " + wmText]),
      el("div", { class: "watermark-line" }, [wmText + "   " + wmText + "   " + wmText])
    ]);
    qCard.appendChild(wmLayer);

    const qContent = el("div", { class: "q-content" });

    // Dòng thẻ Tag & Bộ đếm câu
    qContent.appendChild(
      el("div", { class: "q-tag-row" }, [
        el("span", { class: "q-tag" }, [q.sectionName ? q.sectionName.split(":")[0] : "LỊCH SỬ ĐẢNG"]),
        el("span", { class: "q-counter" }, [`Câu ${s.currentIndex + 1} / ${totalQ}`])
      ])
    );

    // Tiêu đề câu hỏi
    qContent.appendChild(
      el("div", { class: "q-text" }, [q.q])
    );

    // Danh sách 4 đáp án (A, B, C, D) xếp dọc từng dòng (Image 4)
    const letters = ["A", "B", "C", "D"];
    const optionsList = el("div", { class: "options-list" });

    q.options.forEach((optText, optIdx) => {
      const isSelected = currentAnswer === optIdx;
      let optClass = "opt-btn";

      if (s.mode === "practice" || s.mode === "wrongReview") {
        if (currentAnswer !== null) {
          if (optIdx === q.answer) {
            optClass += " correct";
          } else if (isSelected) {
            optClass += " wrong";
          }
        }
      } else {
        // Chế độ thi thử (Exam)
        if (isSelected) {
          optClass += " selected";
        }
      }

      const optBtn = el("button", {
        class: optClass,
        disabled: (s.mode !== "exam" && currentAnswer !== null) ? "disabled" : null,
        onclick: () => {
          handleSelectOption(optIdx);
        }
      }, [
        el("span", { class: "opt-letter" }, [letters[optIdx]]),
        el("span", { class: "opt-text" }, [optText])
      ]);

      optionsList.appendChild(optBtn);
    });

    qContent.appendChild(optionsList);

    // Hộp giải thích (trong chế độ Luyện tập khi đã chọn đáp án)
    if ((s.mode === "practice" || s.mode === "wrongReview") && currentAnswer !== null) {
      qContent.appendChild(
        el("div", { class: "explain-box" }, [
          el("div", { class: "explain-title" }, [
            currentAnswer === q.answer ? "✓ Đúng rồi!" : "✗ Chưa chính xác!",
            " — ",
            letters[q.answer] + " là đáp án đúng"
          ]),
          el("p", { class: "explain-desc" }, [q.explain || "Đáp án đã được kiểm chứng chuẩn xác theo giáo trình."])
        ])
      );
    }

    // Các nút hành động dưới đáy (Actions: Câu trước / Câu tiếp / Nộp bài)
    const actions = el("div", { class: "q-actions" });

    // Nút Câu trước
    const prevBtn = el("button", {
      class: "btn btn-ghost",
      onclick: () => {
        if (s.currentIndex > 0) {
          s.currentIndex--;
          render();
        }
      }
    }, ["‹ Câu trước"]);
    if (s.currentIndex === 0) {
      prevBtn.setAttribute("disabled", "disabled");
      prevBtn.style.opacity = "0.4";
      prevBtn.style.cursor = "default";
    }
    actions.appendChild(prevBtn);

    // Mở bảng câu hỏi trong chế độ thi thử
    if (s.mode === "exam") {
      actions.appendChild(
        el("button", {
          class: "palette-btn-open",
          onclick: () => {
            showExamPaletteModal();
          }
        }, [`Danh sách câu (${s.userAnswers.filter(a => a !== null).length}/${totalQ})`])
      );
    }

    // Nút Câu tiếp hoặc Nộp bài
    const isLast = s.currentIndex === totalQ - 1;
    let nextLabel = "Câu tiếp ›";
    if (isLast) {
      nextLabel = s.mode === "exam" ? "Nộp bài" : "Hoàn thành bài";
    }

    const nextBtn = el("button", {
      class: "btn btn-primary",
      onclick: () => {
        if (isLast) {
          if (s.mode === "exam") {
            const unanswered = s.userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
              if (!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Bạn có chắc chắn muốn nộp bài ngay không?`)) {
                return;
              }
            }
          }
          finishQuiz();
        } else {
          s.currentIndex++;
          render();
        }
      }
    }, [nextLabel]);

    actions.appendChild(nextBtn);
    qContent.appendChild(actions);

    qCard.appendChild(qContent);
    inner.appendChild(qCard);

    wrap.appendChild(inner);
    return wrap;
  }

  function handleSelectOption(optIdx) {
    const s = state.quizSession;
    if (!s) return;
    const q = s.questions[s.currentIndex];

    if (s.mode === "practice" || s.mode === "wrongReview") {
      if (s.userAnswers[s.currentIndex] !== null) return; // đã trả lời rồi
      s.userAnswers[s.currentIndex] = optIdx;

      if (optIdx === q.answer) {
        s.score++;
        playSound("correct");
        removeWrongQuestion(q.id);
      } else {
        playSound("wrong");
        addWrongQuestion(q.id);
      }
    } else {
      // Chế độ Exam: cho phép đổi đáp án
      s.userAnswers[s.currentIndex] = optIdx;
    }
    render();
  }

  /* ---------------- HOÀN THÀNH BÀI LÀM & TÍNH ĐIỂM ---------------- */
  function finishQuiz() {
    const s = state.quizSession;
    if (!s) return;
    if (s.timerInterval) clearInterval(s.timerInterval);

    s.isSubmitted = true;
    s.completedTime = Date.now();

    // Tính số câu đúng
    let correctCount = 0;
    let answeredCount = 0;
    s.questions.forEach((q, i) => {
      if (s.userAnswers[i] !== null) answeredCount++;
      if (s.userAnswers[i] === q.answer) correctCount++;
    });

    s.correctCount = correctCount;
    s.answeredCount = answeredCount;

    // Tính điểm theo thang 10
    const score10 = Number(((correctCount / s.questions.length) * 10).toFixed(2));
    s.score10 = score10;

    // Lưu kết quả vào danh sách của Giảng viên
    const record = {
      id: "sub_" + Date.now(),
      studentName: s.student.name || "Ẩn danh",
      studentMssv: s.student.mssv || "---",
      modeName: s.title,
      score10: score10,
      correct: correctCount,
      total: s.questions.length,
      durationSeconds: Math.round((s.completedTime - s.startTime) / 1000),
      timestamp: new Date().toLocaleString("vi-VN")
    };
    saveSubmission(record);

    state.view = "results";
    render();
  }

          el("div", { style: "font-size:13px;color:var(--ink-muted);text-align:center;" }, ["(Chạm vào thẻ để xem đáp án)"])
        ]),

              `${letters[q.answer]}. ${q.options[q.answer]}`

          ]),
          el("div", { style: "font-size:13px;color:var(--ink-muted);text-align:center;" }, ["(Chạm để lật lại)"])
        ])
      ])
    ]);

    inner.appendChild(el("div", { class: "flash-container" }, [
      flashcard,
      el("div", { class: "btn-row", style: "gap:16px;" }, [
        el("button", {
          class: "btn btn-ghost",

          style: curIdx === 0 ? "opacity:0.4;cursor:default;" : "",
          onclick: () => {
            if (curIdx > 0) {
              state.flashIndex--;

              state.flashFlipped = false;
              render();
            }
          }
        }, ["Thẻ tiếp ›"])
      ])
    ]));

    wrap.appendChild(inner);
    return wrap;
  }

      state.view = "subjectPicker";
      render();
    }));

      id: "teacher-pw-input"
    });

    const errorBox = el("div", { class: "gate-error" });

    function tryTeacherUnlock() {
      const val = input.value.trim();
      const currentPw = getTeacherPassword();
      if (!val) {
        errorBox.textContent = "Vui lòng nhập mật khẩu giảng viên.";
        return;
      }
      if (val === currentPw) {
        sessionStorage.setItem(KEYS.TEACHER_SESSION, "true");
        state.view = "teacherDashboard";
        render();
      } else {
        errorBox.textContent = "Mật khẩu giảng viên không đúng!";
        input.focus();
        input.select();
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tryTeacherUnlock();
    });

    const card = el("div", { class: "gate-card" }, [
      el("h2", {}, ["Đăng nhập Giảng viên"]),
      el("p", {}, ["Khu vực bảo mật dành cho giảng viên xem thống kê kết quả làm bài của sinh viên và xuất báo cáo Excel."]),

        el("strong", { style: "color:var(--crimson);" }, ["giangvien2026"])
      ])
    ]);

    inner.appendChild(card);
    wrap.appendChild(inner);

    setTimeout(() => {
      input.focus();

  /* TAB 1: THỐNG KÊ & DANH SÁCH SINH VIÊN */
  function renderTeacherStats() {
    const container = el("div", {});
    const submissions = loadSubmissions();

    // Tính toán KPI
    const totalCount = submissions.length;
    let avgScore = 0;
    let passedCount = 0;
    const uniqueStudents = new Set();

    if (totalCount > 0) {
      const sum = submissions.reduce((acc, cur) => acc + (cur.score10 || 0), 0);
      avgScore = (sum / totalCount).toFixed(1);
      passedCount = submissions.filter(s => (s.score10 || 0) >= 5.0).length;
      submissions.forEach(s => uniqueStudents.add(s.studentMssv));
    }

    const passRate = totalCount > 0 ? Math.round((passedCount / totalCount) * 100) : 0;

    // Grid KPI
    const kpiGrid = el("div", { class: "kpi-grid" }, [
      el("div", { class: "kpi-card" }, [
        el("div", { class: "kpi-val" }, [String(totalCount)]),
        el("div", { class: "kpi-label" }, ["Lượt làm bài"])
      ]),
      el("div", { class: "kpi-card" }, [
        el("div", { class: "kpi-val" }, [String(uniqueStudents.size)]),
        el("div", { class: "kpi-label" }, ["Sinh viên tham gia"])
      ]),
      el("div", { class: "kpi-card" }, [
        el("div", { class: "kpi-val" }, [totalCount > 0 ? avgScore : "0.0"]),
        el("div", { class: "kpi-label" }, ["Điểm trung bình"])
      ]),
      el("div", { class: "kpi-card" }, [
        el("div", { class: "kpi-val", style: "color:var(--success);" }, [`${passRate}%`]),
        el("div", { class: "kpi-label" }, ["Tỷ lệ đạt (≥ 5.0)"])
      ])
    ]);
    container.appendChild(kpiGrid);

    // Thanh tìm kiếm và xuất Excel
    const searchBar = el("div", { class: "search-bar-row" }, [
      el("input", {
        type: "text",
        class: "text-input",
        style: "max-width:320px;padding:8px 14px;font-size:14px;",
        placeholder: "🔍 Tìm theo tên hoặc MSSV...",

        el("button", {
          class: "btn btn-primary",

        el("button", {
          class: "btn btn-ghost",

            if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử nộp bài của sinh viên không? Thao tác này không thể hoàn tác.")) {
              clearSubmissions();
              render();
            }
          }
        }, ["🗑 Xóa lịch sử"])
      ])
    ]);
    container.appendChild(searchBar);

    // Bảng danh sách bài nộp
    const tableWrap = el("div", { class: "admin-table-wrap" });

      el("thead", {}, [
        el("tr", {}, [
          el("th", {}, ["STT"]),
          el("th", {}, ["Họ và tên"]),
          el("th", {}, ["MSSV"]),
          el("th", {}, ["Bài làm"]),
          el("th", {}, ["Điểm (thang 10)"]),
          el("th", {}, ["Số câu đúng"]),
          el("th", {}, ["Thời gian"]),
          el("th", {}, ["Ngày giờ nộp"])
        ])
      ])
    );

    const tbody = el("tbody", { id: "submissions-tbody" });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    container.appendChild(tableWrap);

    function updateSubmissionsTable() {
      tbody.innerHTML = "";
      const query = state.teacherSearch;
      const filtered = submissions.filter(item => {
        if (!query) return true;
        const name = (item.studentName || "").toLowerCase();
        const mssv = (item.studentMssv || "").toLowerCase();
        return name.includes(query) || mssv.includes(query);
      });

      if (filtered.length === 0) {
        tbody.appendChild(
          el("tr", {}, [
            el("td", { colspan: "8", style: "text-align:center;padding:24px;color:var(--ink-muted);" }, [
              submissions.length === 0
                ? "Chưa có lượt nộp bài nào từ sinh viên."
                : "Không tìm thấy kết quả phù hợp với từ khóa tìm kiếm."
            ])
          ])
        );
        return;
      }

      filtered.forEach((item, idx) => {
        tbody.appendChild(
          el("tr", {}, [
            el("td", {}, [String(idx + 1)]),
            el("td", { style: "font-weight:600;" }, [item.studentName]),
            el("td", {}, [item.studentMssv]),
            el("td", {}, [item.modeName]),
            el("td", {
              style: `font-weight:700;color:${(item.score10 || 0) >= 5 ? "var(--success)" : "var(--danger)"};`
            }, [String(item.score10)]),
            el("td", {}, [`${item.correct}/${item.total}`]),
            el("td", {}, [formatTime(item.durationSeconds || 0)]),
            el("td", { style: "font-size:12.5px;color:var(--ink-soft);" }, [item.timestamp || "---"])
          ])
        );
      });
    }

    updateSubmissionsTable();
    return container;
  }

  /* XUẤT DỮ LIỆU SANG FILE EXCEL (.xlsx) BẰNG SHEETJS */
  function exportSubmissionsToExcel() {
    const list = loadSubmissions();
    if (list.length === 0) {
      alert("Chưa có dữ liệu nào để xuất ra file Excel!");
      return;
    }

    if (typeof XLSX === "undefined") {
      alert("Thư viện SheetJS chưa được tải, vui lòng kiểm tra kết nối mạng!");
      return;
    }

    const data = list.map((item, idx) => ({
      "STT": idx + 1,
      "Họ và tên": item.studentName,
      "Mã số sinh viên (MSSV)": item.studentMssv,
      "Phần thi": item.modeName,
      "Điểm hệ 10": item.score10,
      "Số câu đúng": item.correct,
      "Tổng số câu": item.total,
      "Thời gian làm": formatTime(item.durationSeconds || 0),
      "Thời điểm nộp bài": item.timestamp
    }));

    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "KetQuaSinhVien");

    const dateStr = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(workbook, `Ket_qua_on_tap_LSD_${dateStr}.xlsx`);
  }

  /* TAB 2: THỐNG KÊ CÂU HỎI HAY SAI NHẤT */
  function renderTeacherWrongStats() {
    const container = el("div", {});
    const bank = loadWrongBank();
    const all = window.QUESTION_BANK_LSD || [];

    const sortedIds = Object.keys(bank).map(Number).sort((a, b) => (bank[b] || 0) - (bank[a] || 0));

    container.appendChild(
      el("p", { style: "font-size:14.5px;color:var(--ink-soft);margin-bottom:16px;" }, [
        "Danh sách những câu hỏi mà sinh viên trả lời sai nhiều nhất được tổng hợp tự động:"
      ])
    );

    if (sortedIds.length === 0) {
      container.appendChild(
        el("div", { class: "gate-card", style: "text-align:center;padding:30px;" }, [
          el("p", { style: "color:var(--ink-soft);" }, ["Chưa có dữ liệu câu hỏi sai nào được ghi nhận trên thiết bị."])
        ])
      );
      return container;
    }

    const list = el("div", { class: "part-list" });
    const letters = ["A", "B", "C", "D"];

    sortedIds.forEach((qId, idx) => {
      const q = all.find(item => item.id === qId);
      if (!q) return;

      const wrongCount = bank[qId] || 1;

      list.appendChild(
        el("div", { class: "review-item" }, [
          el("div", { class: "q-tag-row" }, [
            el("span", { class: "q-tag" }, [`CÂU ${q.id} (Top ${idx + 1})`]),
            el("span", { style: "font-size:13px;font-weight:700;color:var(--danger);" }, [
              `Bị sai ${wrongCount} lượt`
            ])
          ]),
          el("p", { style: "font-size:16px;font-weight:600;margin-bottom:8px;color:var(--ink);" }, [q.q]),
          el("p", { style: "font-size:14px;color:var(--success);font-weight:600;margin-bottom:6px;" }, [
            `Đáp án đúng: ${letters[q.answer]}. ${q.options[q.answer]}`
          ]),
          el("p", { style: "font-size:13.5px;color:var(--ink-soft);line-height:1.45;" }, [
            `💡 ${q.explain}`
          ])
        ])
      );
    });

    container.appendChild(list);
    return container;
  }

  /* TAB 3: ĐỔI MẬT KHẨU */
  function renderTeacherPasswordSettings() {
    const container = el("div", {});

    // Card 1: Đổi mật khẩu môn học sinh viên
    const subjCard = el("div", { class: "gate-card", style: "margin-bottom:24px;" }, [
      el("h2", {}, ["Mật khẩu môn học (Sinh viên)"]),
      el("p", {}, ["Mật khẩu mà sinh viên phải nhập khi vào học phần Lịch sử Đảng."]),
      el("div", { class: "form-group" }, [
        el("input", {
          type: "text",
          class: "text-input",
          id: "new-subject-pw",
          value: getSubjectPassword()
        })
      ]),
      el("div", { class: "btn-row" }, [
        el("button", {
          class: "btn btn-primary",
          onclick: () => {
            const input = document.getElementById("new-subject-pw");
            if (!input || !input.value.trim()) {
              alert("Mật khẩu không được để trống!");
              return;
            }
            setSubjectPassword(input.value.trim());
            alert("Đã cập nhật mật khẩu môn học thành công!");
          }
        }, ["Lưu mật khẩu môn học"])
      ])
    ]);
    container.appendChild(subjCard);

    // Card 2: Đổi mật khẩu Giảng viên
    const teacherCard = el("div", { class: "gate-card" }, [
      el("h2", {}, ["Mật khẩu Giảng viên"]),
      el("p", {}, ["Mật khẩu để vào Bảng điều khiển Giảng viên hiện tại."]),
      el("div", { class: "form-group" }, [
        el("input", {
          type: "text",
          class: "text-input",
          id: "new-teacher-pw",
          value: getTeacherPassword()
        })
      ]),
      el("div", { class: "btn-row" }, [
        el("button", {
          class: "btn btn-primary",
          onclick: () => {
            const input = document.getElementById("new-teacher-pw");
            if (!input || !input.value.trim()) {
              alert("Mật khẩu không được để trống!");
              return;
            }
            setTeacherPassword(input.value.trim());
            alert("Đã cập nhật mật khẩu giảng viên thành công!");
          }
        }, ["Lưu mật khẩu giảng viên"])
      ])
    ]);
    container.appendChild(teacherCard);

    return container;
  }

  /* ---------------- HÀM VẼ GIAO DIỆN CHÍNH (RENDER) ---------------- */
  function render() {
    const app = document.getElementById("app");
    if (!app) return;

    // Kiểm tra khóa không hoạt động quá 60 phút
    if (isSessionLocked || localStorage.getItem(KEYS.INACTIVITY_LOCKED) === "true") {
      showInactivityLockOverlay();
    }

    // Bảo vệ an toàn: Các màn hình học tập phải có mật khẩu môn học
    const studentScreens = ["home", "chapterPicker", "chapterDetail", "identity", "quiz", "results", "flashcard"];
    if (studentScreens.includes(state.view) && sessionStorage.getItem(KEYS.STUDENT_SESSION) !== "true") {
      state.view = "gate";
    }

    app.innerHTML = "";

    switch (state.view) {
      case "subjectPicker":
        app.appendChild(renderSubjectPicker());
        break;
      case "gate":
        app.appendChild(renderGate());
        break;
      case "home":
        app.appendChild(renderHome());
        break;
      case "chapterPicker":
        app.appendChild(renderChapterPicker());
        break;
      case "chapterDetail":
        app.appendChild(renderChapterDetail());
        break;
      case "identity":
        app.appendChild(renderIdentity());
        break;
      case "quiz":
        app.appendChild(renderQuiz());
        break;
      case "results":
        app.appendChild(renderResults());
        break;
      case "flashcard":
        app.appendChild(renderFlashcard());
        break;
      case "teacherGate":
        app.appendChild(renderTeacherGate());
        break;
      case "teacherDashboard":
        app.appendChild(renderTeacherDashboard());
        break;
      default:
        app.appendChild(renderSubjectPicker());
    }

    if (typeof window.scrollTo === "function") { window.scrollTo({ top: 0, behavior: "smooth" }); }
  }

  // Khởi động khi tài liệu sẵn sàng
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
})();

  </script>
